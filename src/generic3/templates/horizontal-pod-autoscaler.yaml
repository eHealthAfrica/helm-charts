{{ if and (.Values.app.scaling.enabled) (ne .Values.resourceType "cronjob") }}
{{- $app := .Values.app.resources.requests | default dict }}
{{- if not (or (and $app.cpu .Values.app.scaling.utilization.cpu) (and $app.memory .Values.app.scaling.utilization.memory)) }}
{{- fail "app.scaling.enabled is true but no HPA metric can be computed: set app.resources.requests.cpu or .memory, or set app.scaling.enabled=false" }}
{{- end }}
{{- /* Utilization is summed over every container, so a metric needs its request on
       all of them. With none computable, skip the HPA: the workload keeps replicaCount. */}}
{{- $cpu := and (include "generic.allContainersRequest" (list . "cpu")) .Values.app.scaling.utilization.cpu }}
{{- $mem := and (include "generic.allContainersRequest" (list . "memory")) .Values.app.scaling.utilization.memory }}
{{- if or $cpu $mem }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ template "generic.fullname" . }}
  labels:
    app: {{ template "generic.name" . }}
    chart: {{ template "generic.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ .Values.resourceType }}
    name: {{ template "generic.fullname" . }}
  minReplicas: {{ .Values.app.scaling.min }}
  maxReplicas: {{ .Values.app.scaling.max }}
  metrics:
    {{- /* A Resource metric whose request is unset is uncomputable, and one bad
           metric stops the HPA acting on the others. Emit only what can compute. */}}
    {{- if $cpu }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.app.scaling.utilization.cpu }}
    {{- end }}
    {{- if $mem }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.app.scaling.utilization.memory }}
    {{- end }}
{{- end }}
{{ end }}
